appId: com.kentxxq.khooks
productName: KHooks
electronFuses:
  runAsNode: true
artifactName: KHooks-Setup-${version}-${arch}.${ext}
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
  - resources/icon.png
extraResources:
  - from: scripts/khooks.mjs
    to: cli/khooks.mjs
  - from: debug/tmpfile-AI-windows-events
    to: windows-events
    filter:
      - WindowsEvents.exe
publish:
  provider: github
  owner: kentxxq
  repo: KHooks
win:
  target: nsis
  extraFiles:
    - from: scripts/khooks.cmd
      to: khooks.cmd
  icon: resources/icon.ico
  verifyUpdateCodeSignature: false
nsis:
  oneClick: true
  perMachine: false
  createStartMenuShortcut: true
  runAfterFinish: false
  installerIcon: icon.ico
  installerHeaderIcon: icon.ico
  uninstallerIcon: icon.ico
