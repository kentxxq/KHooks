name: 发布 Windows 安装包

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
      - name: 校验版本标签
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $env:GITHUB_REF_NAME -ne "v$version") {
            throw '版本标签必须与 package.json 中的正式版本一致'
          }
      - name: 提取版本发布说明
        shell: pwsh
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $tag = [regex]::Escape($env:GITHUB_REF_NAME)
          $versionHeadings = [regex]::Matches($changelog, "(?m)^### $tag \(\d{4}-\d{2}-\d{2}\)[ \t]*\r?$")
          if ($versionHeadings.Count -ne 1) {
            throw "CHANGELOG.md 必须包含唯一的 $env:GITHUB_REF_NAME 版本标题"
          }

          $heading = $versionHeadings[0]
          $afterHeading = $changelog.Substring($heading.Index + $heading.Length)
          $notes = ($afterHeading -csplit '(?m)^#{1,3}[ \t]+', 2)[0].Trim()
          if (-not $notes) { throw "CHANGELOG.md 中 $env:GITHUB_REF_NAME 的发布说明为空" }

          $notesFile = Join-Path $env:RUNNER_TEMP 'khooks-release-notes.md'
          Set-Content -LiteralPath $notesFile -Value $notes -Encoding utf8NoBOM
      # 发版门禁只跑离线单测:public-ip.test.ts 探测 8 个外部站点,第三方故障不应阻塞发版(本地 vp run test 仍跑全量)。
      - run: pnpm vitest run --exclude 'tests/public-ip.test.ts'
      - run: vp run build
      - run: vp run typecheck
      - run: vp run package:win
      - name: 发布更新文件
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem dist/KHooks-Setup-*.exe, dist/KHooks-Setup-*.exe.blockmap, dist/latest.yml)
          if ($assets.Count -ne 3) { throw '发布文件不完整' }
          $notesFile = Join-Path $env:RUNNER_TEMP 'khooks-release-notes.md'
          gh release create $env:GITHUB_REF_NAME $assets.FullName --verify-tag --notes-file $notesFile
